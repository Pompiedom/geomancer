[workspace]
resolver = "3"
members = ["common", "spiral", "rose", "rosette"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde_json = "1"
geomancer-common = { path = "common" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
